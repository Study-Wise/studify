name: Greetings

on: [pull_request_target, issues]

jobs:
    greeting:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - uses: actions/first-interaction@v1
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  issue-message: |
                      Thanks for opening your first issue in Studify! 👋
                      We'll take a look as soon as we can. Please make sure you've filled in the template so we have what we need to help.
                  pr-message: |
                      Thanks for your first pull request to Studify! 🎉
                      A developer or maintainer will review it soon. Please make sure `npm run check` passes and see CONTRIBUTING.md for our guidelines.
