name: Check

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        name: ESLint, Astro Check & Stylelint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - run: npm ci
            - name: ESLint
              run: npx eslint src --max-warnings 0
            - name: Astro Check
              run: npx astro check
            - name: Stylelint
              run: npx stylelint "src/**/*.scss"
