name: Check

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        name: ESLint, Astro Check, Stylelint, and Build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - run: npm ci
            - name: Full Check Suite
              run: npm run check
